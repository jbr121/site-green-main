services:
  - type: web
    name: gold-skull
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: 1
      - key: TRUST_PROXY
        value: 1
      - key: SESSION_SECRET
        generateValue: true
